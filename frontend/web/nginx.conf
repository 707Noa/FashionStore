
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # CONFIGURACION GENERAL
    # ==========================================

    charset utf-8;

    client_max_body_size 20M;

    # ==========================================
    # FRONTEND ANGULAR
    # ==========================================

    # Angular Router utiliza rutas sin #.
    # Las rutas que no correspondan a un archivo
    # se redirigen a index.html.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # BACKEND FASTAPI
    # ==========================================

    # BACKEND_HOST se configura por entorno.
    #
    # Docker local:
    # BACKEND_HOST=backend
    #
    # Railway:
    # BACKEND_HOST=fashionstore-da2b673c.railway.internal
    #
    # Todas las solicitudes /api/ se envian
    # al backend FastAPI por el puerto 8000.

    location ^~ /api/ {

        proxy_pass http://${BACKEND_HOST}:8000/api/;

        proxy_http_version 1.1;

        # Cabeceras HTTP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tiempos de espera
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Permitir subida de imagenes y archivos
        client_max_body_size 20M;

        # No almacenar respuestas de API en cache
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ==========================================
    # ARCHIVOS ESTATICOS DE ANGULAR
    # ==========================================

    location ~* \.(css|js|woff|woff2|ttf|svg|ico|png|jpg|jpeg|gif|webp)$ {

        expires 30d;

        access_log off;

        add_header Cache-Control "public";
    }

    # ==========================================
    # SEGURIDAD HTTP
    # ==========================================

    add_header X-Content-Type-Options "nosniff" always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin" always;

    # ==========================================
    # LOGS
    # ==========================================

    access_log /var/log/nginx/access.log;

    error_log /var/log/nginx/error.log warn;
}
