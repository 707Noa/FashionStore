server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver para Nginx cuando usa variables en proxy_pass.
    # Detectado dinámicamente por nginx-entrypoint.sh según /etc/resolv.conf:
    # - docker-compose: 127.0.0.11
    # - Railway: fd12::10 (IPv6)
    ${RESOLVER}
    resolver_timeout 5s;

    # Angular Router usa rutas "path" (sin #), así que cualquier ruta desconocida
    # por Nginx debe resolver a index.html para que el Router la maneje en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La app llama a rutas relativas "/api/v1/..." (ver environment.ts).
    # Nginx las reenvía al backend vía variable ${BACKEND_URL}.
    #
    # BACKEND_URL se define en docker-compose.yml o en Railway:
    # - docker-compose: BACKEND_URL=backend:8000 (nombre de servicio en red interna)
    # - Railway: BACKEND_URL=backend.railway.internal:8080 (servicio en red privada Railway)
    #
    # "^~" es necesario: sin él, la regla de cache de estáticos de abajo (que
    # matchea por extensión) le gana a este prefijo para archivos como
    # /api/v1/media/*.jpg (imágenes servidas por el backend, ver
    # app/core/image_storage.py), y nginx las busca en el propio frontend
    # devolviendo 404 en vez de reenviarlas al backend.
    location ^~ /api/ {
        set $backend_url "${BACKEND_URL}";
        proxy_pass http://$backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
