@if (open()) {
  <div class="drawer-overlay" (click)="close.emit()">
    <aside class="drawer" (click)="$event.stopPropagation()">
      <header class="drawer__header">
        <h2>{{ readonly() ? 'Detalle de proveedor' : isEditMode ? 'Editar proveedor' : 'Nuevo proveedor' }}</h2>
        <button type="button" class="icon-btn" (click)="close.emit()" aria-label="Cerrar">
          <app-icon name="close" style="width: 16px; height: 16px" />
        </button>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="drawer__form">
        <label
          class="field"
          [class.has-error]="form.controls.razon_social.invalid && form.controls.razon_social.touched"
        >
          <span class="field__label">Razón social *</span>
          <input type="text" formControlName="razon_social" placeholder="Ej. Textiles Andinos S.R.L." />
          @if (form.controls.razon_social.invalid && form.controls.razon_social.touched) {
            <span class="field__error">La razón social es obligatoria.</span>
          }
        </label>

        <label
          class="field"
          [class.has-error]="form.controls.nombre_contacto.invalid && form.controls.nombre_contacto.touched"
        >
          <span class="field__label">Nombre de contacto *</span>
          <input type="text" formControlName="nombre_contacto" placeholder="Ej. Juan Pérez" />
          @if (form.controls.nombre_contacto.invalid && form.controls.nombre_contacto.touched) {
            <span class="field__error">El nombre de contacto es obligatorio.</span>
          }
        </label>

        <div class="field-row">
          <label
            class="field"
            [class.has-error]="form.controls.correo.invalid && form.controls.correo.touched"
          >
            <span class="field__label">Correo *</span>
            <input type="email" formControlName="correo" placeholder="contacto@proveedor.com" />
            @if (form.controls.correo.hasError('required') && form.controls.correo.touched) {
              <span class="field__error">El correo es obligatorio.</span>
            } @else if (form.controls.correo.hasError('email') && form.controls.correo.touched) {
              <span class="field__error">Ingresa un correo válido.</span>
            }
          </label>

          <label
            class="field"
            [class.has-error]="form.controls.telefono.invalid && form.controls.telefono.touched"
          >
            <span class="field__label">Teléfono *</span>
            <input type="text" formControlName="telefono" placeholder="Ej. 70012345" />
            @if (form.controls.telefono.invalid && form.controls.telefono.touched) {
              <span class="field__error">Ingresa un teléfono válido.</span>
            }
          </label>
        </div>

        <label class="field field--switch">
          <span class="field__label">Estado</span>
          <span class="switch">
            <input type="checkbox" formControlName="is_active" />
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span class="switch__text">{{ form.controls.is_active.value ? 'Activo' : 'Inactivo' }}</span>
          </span>
        </label>

        <footer class="drawer__footer">
          @if (readonly()) {
            <button type="button" class="btn btn--ghost" (click)="close.emit()">Cerrar</button>
          } @else {
            <button type="button" class="btn btn--ghost" (click)="close.emit()" [disabled]="submitting()">
              Cancelar
            </button>
            <button type="submit" class="btn btn--primary" [disabled]="submitting()">
              {{ submitting() ? 'Guardando…' : 'Guardar proveedor' }}
            </button>
          }
        </footer>
      </form>
    </aside>
  </div>
}
