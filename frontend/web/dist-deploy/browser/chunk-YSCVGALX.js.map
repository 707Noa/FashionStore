<section class="admin-card section form-page">
  <div class="section__header">
    <div>
      <h3>Enviar producto</h3>
      <p>Comparte la información de una prenda que ofreces a FashionStore.</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-page__body">
    <label class="field" [class.has-error]="form.controls.nombre.invalid && form.controls.nombre.touched">
      <span class="field__label">Nombre *</span>
      <input type="text" formControlName="nombre" placeholder="Ej. Chaqueta Denim Clásica" />
      @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
        <span class="field__error">El nombre es obligatorio.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Descripción</span>
      <textarea formControlName="descripcion" rows="4" placeholder="Detalles de la prenda (opcional)"></textarea>
    </label>

    <div class="field">
      <span class="field__label">Imagen de referencia</span>
      @if (imagenPreviewUrl(); as preview) {
        <div class="imagen-preview">
          <img [src]="preview" alt="Vista previa" />
          <button type="button" class="imagen-preview__quitar" (click)="quitarImagen()">
            <app-icon name="close" style="width: 13px; height: 13px" />
            Quitar
          </button>
        </div>
      } @else {
        <label class="imagen-picker">
          <app-icon name="products" style="width: 22px; height: 22px" />
          <span>Subir imagen (JPG, PNG o WEBP)</span>
          <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onImagenSeleccionada($event)" hidden />
        </label>
      }
      <span class="field__hint">Es solo una referencia para el Administrador; no es la imagen final del catálogo.</span>
    </div>

    <label class="field field--switch">
      <span class="field__label">Disponibilidad</span>
      <span class="switch">
        <input type="checkbox" formControlName="disponibilidad" />
        <span class="switch__track"><span class="switch__thumb"></span></span>
        <span class="switch__text">{{ form.controls.disponibilidad.value ? 'Disponible' : 'No disponible' }}</span>
      </span>
    </label>

    <footer class="form-page__footer">
      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        <app-icon name="plus" style="width: 14px; height: 14px" />
        {{ submitting() ? 'Enviando…' : 'Enviar producto' }}
      </button>
    </footer>
  </form>
</section>
