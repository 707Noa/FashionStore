<button
  type="button"
  class="menu-toggle"
  (click)="abrirMenu.emit()"
  aria-label="Abrir menú"
>
  <app-icon name="menu" style="width: 20px; height: 20px" />
</button>

<div class="header-text">
  <h1>{{ title() }}</h1>
  @if (subtitle()) {
    <p>{{ subtitle() }}</p>
  }
</div>

<div class="header-actions">
  <div class="avatar">{{ iniciales }}</div>
  <span class="profile-name">{{ usuario()?.nombre ?? 'Cajero' }}</span>
  <button type="button" class="btn btn--ghost btn--sm" (click)="logout()">Cerrar sesión</button>
</div>
