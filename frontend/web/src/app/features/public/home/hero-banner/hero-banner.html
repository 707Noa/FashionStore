<div class="hero">
  <div class="hero__text">
    <h1>NUEVA COLECCIÓN</h1>
    @if (coleccionDestacada(); as coleccion) {
      <a
        routerLink="/home/catalogo"
        [queryParams]="{ coleccion_id: coleccion.id }"
        class="hero__cta"
      >Explorar colección</a>
      @if (coleccion.imagen_destacada_url && connectivity.isOnline()) {
        <img [src]="resolveMediaUrl(coleccion.imagen_destacada_url)" alt="" class="hero__image" />
      }
    }
  </div>
</div>
